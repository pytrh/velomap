# Spring Boot configuration for the Velomap backend.
# Spring reads this file at startup; values here can be injected into classes
# with @Value("${name}"). ${X:} means "environment variable X, or empty if unset".

spring.application.name=velomap
server.port=8080

# Load the repo-root .env file (KEY=value lines) as extra properties, so
# `./mvnw spring-boot:run` finds GRAPHHOPPER_API_KEY without exporting it.
# A real environment variable still wins over the file. "optional:" = no error if missing.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

graphhopper.base-url=https://graphhopper.com/api/1
graphhopper.api-key=${GRAPHHOPPER_API_KEY:}
